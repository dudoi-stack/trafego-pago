<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Gestor de Tráfego — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --font-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#EBEFED; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#16201C; --ink-2:#3A4843; --muted:#647570;
  --line:#D8DFDC; --line-2:#E8EDEB; --btn:#16201C; --btn-ink:#FFFFFF;
  --good:#0B8A4C; --good-bg:#D9F2E4; --good-seg:#2FBF7A;
  --ok:#0E76B8;   --ok-bg:#D8ECF9;   --ok-seg:#3AA6E6;
  --warn:#8A5F00; --warn-bg:#F6E8BE; --warn-seg:#E2AE1F;
  --bad:#B72929;  --bad-bg:#F8DADA;  --bad-seg:#E5595B;
  --wait:#5D6D68; --wait-bg:#E3E9E6; --hatch:#C9D2CE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1614; --surface:#172220; --surface-2:#1C2926; --ink:#E7EEEB; --ink-2:#C1CCC8; --muted:#8FA09A;
    --line:#2A3A36; --line-2:#22302C; --btn:#E7EEEB; --btn-ink:#0F1614;
    --good:#4ED08A; --good-bg:#12382A; --ok:#63B8F0; --ok-bg:#12334A;
    --warn:#E8BC4A; --warn-bg:#3D3210; --bad:#F0787A; --bad-bg:#432022;
    --wait:#9BAAA5; --wait-bg:#25332F; --hatch:#33443F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1614; --surface:#172220; --surface-2:#1C2926; --ink:#E7EEEB; --ink-2:#C1CCC8; --muted:#8FA09A;
  --line:#2A3A36; --line-2:#22302C; --btn:#E7EEEB; --btn-ink:#0F1614;
  --good:#4ED08A; --good-bg:#12382A; --ok:#63B8F0; --ok-bg:#12334A;
  --warn:#E8BC4A; --warn-bg:#3D3210; --bad:#F0787A; --bad-bg:#432022;
  --wait:#9BAAA5; --wait-bg:#25332F; --hatch:#33443F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:-.015em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.ic{flex:none}
.sub{color:var(--muted);font-size:13px}
.mut{color:var(--muted)}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font:700 17px/1.1 var(--font-display);letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.bdg{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.nav a[aria-current="page"] .bdg{background:transparent;border-color:currentColor;color:inherit}
.side-foot{margin-top:auto;display:grid;gap:10px}
.demo{font-size:12px;color:var(--muted);padding:0 10px}
.main{min-width:0;padding:26px 32px 56px}
.wrap{max-width:1240px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:30px;line-height:1.1;font-weight:700}
.ph .sub{margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}

/* ---------- botões e controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:13px}
.in{height:40px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.in:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.in.sm{height:34px;width:auto}
textarea.in{height:auto;min-height:92px;padding:10px 12px;resize:vertical}
.in.err{border-color:var(--bad)}
.fb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.ctl{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink);white-space:nowrap}
.ctl:hover{border-color:var(--muted)}
.ctl small{color:var(--muted);font-size:12px}
.ctl .k{color:var(--muted)}
.ctl select{border:0;background:transparent;outline:0;cursor:pointer;padding:0 2px 0 0;max-width:160px}
.ctl:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.ctl select:focus-visible{outline:0}
.ctl.search{cursor:text;min-width:240px}
.ctl.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.dd{position:relative}
.dd-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:250px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:30}
.dd.open .dd-menu{display:block}
.dd-menu.wide{min-width:320px}
.dd-item{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer}
.dd-item:hover{background:var(--surface-2)}
.dd-item.on{font-weight:700;background:var(--surface-2)}
.dd-sep{height:1px;background:var(--line-2);margin:6px 0}
.range{display:flex;gap:8px;padding:4px 4px 6px}
.range label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.dd-search{padding:4px}
.dd-list{max-height:280px;overflow:auto;padding:2px}
.dd-opt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.dd-opt:hover{background:var(--surface-2)}
.dd-opt small{margin-left:auto;color:var(--muted)}
.dd-foot{padding:6px 8px 4px;border-top:1px solid var(--line-2);margin-top:4px}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px;margin:0}

/* ---------- painéis ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font-size:17px;font-weight:600}
.panel-b{padding:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.good{background:var(--good-seg)}.dot.ok{background:var(--ok-seg)}.dot.warn{background:var(--warn-seg)}.dot.bad{background:var(--bad-seg)}
.dot.ln{height:3px;width:16px;border-radius:2px}

/* resumo do dashboard */
.sum{display:grid;grid-template-columns:minmax(280px,1fr) 2.3fr;overflow:hidden}
.hero{padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.big{font:700 46px/1.05 var(--font-display);letter-spacing:-.03em}
.big.good{color:var(--good)}.big.bad{color:var(--bad)}.big.nil{color:var(--muted)}
.hero-sub{font-size:13px;display:flex;gap:8px;align-items:center;min-height:20px}
.hero-roas{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2);display:grid;gap:8px}
.rrow{display:flex;align-items:center;gap:10px}
.rrow strong{font:700 24px/1 var(--font-display)}
.ticks{position:relative;height:14px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:9px;padding:9px 10px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border-left:1px solid var(--line-2)}
.mgrid>div{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mgrid .v{font:600 21px/1.15 var(--font-display);letter-spacing:-.01em}
.mgrid .s{font-size:12px;color:var(--muted);min-height:16px}
.dl{font-size:12px;font-weight:600}
.dl.g{color:var(--good)}.dl.b{color:var(--bad)}.dl.n{color:var(--muted)}

/* gráfico */
.chart{position:relative;padding:6px 10px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--font-ui);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.16);font-size:12.5px;min-width:190px;z-index:5}
.tip b{display:block;margin-bottom:6px}
.tip div{display:flex;justify-content:space-between;gap:16px}
.tip .mut{font-weight:400}

/* ---------- tabelas ---------- */
.scroll{overflow:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num,.tbl td.num{text-align:right}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[data-sort]:hover{color:var(--ink)}
.tbl th .ar{margin-left:4px;color:var(--ink)}
.tbl td:first-child{min-width:200px}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.nm{font-weight:600}
.tbl .prof{font-weight:600}
.prof.good{color:var(--good)}.prof.bad{color:var(--bad)}
.rz{white-space:nowrap}
.rz .rv{display:inline-block;min-width:38px;font-weight:600;margin-right:10px;text-align:right}

/* chips */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.wait{background:var(--wait-bg);color:var(--wait)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.st::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.st.scaling{font-weight:700;color:var(--ink)}.st.scaling::before{background:currentColor}
.st.paused{color:var(--muted)}.st.paused::before{border-radius:1px;height:2px;border:0;background:currentColor;width:9px}
.st.discarded{color:var(--muted);text-decoration:line-through}

/* régua de ROAS */
.ruler{position:relative;display:inline-grid;grid-template-columns:repeat(4,1fr);gap:2px;width:104px;height:8px;vertical-align:middle}
.ruler.wide{width:100%;height:12px}
.ruler i{border-radius:2px}
.ruler i:nth-child(1){background:var(--bad-seg)}
.ruler i:nth-child(2){background:var(--warn-seg)}
.ruler i:nth-child(3){background:var(--ok-seg)}
.ruler i:nth-child(4){background:var(--good-seg)}
.ruler b{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.ruler.off i{background:var(--line);opacity:.7}

/* ---------- planilha do criativo ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:10px}
.back:hover{color:var(--ink)}
.dsum{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line-2);overflow:hidden}
.dsum>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dsum .v{font:600 20px/1.15 var(--font-display)}
.dsum .v.good{color:var(--good)}.dsum .v.bad{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:transparent;cursor:pointer;font-weight:600;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.sheetbox{max-height:62vh;overflow:auto}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px}
.sheet th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:right;font-size:12px;font-weight:600;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet th.l,.sheet td.dt{text-align:left}
.sheet th.auto{background:var(--surface-2)}
.sheet td{padding:0 4px;height:38px;border-bottom:1px solid var(--line-2)}
.sheet td.dt{padding:0 12px;font-weight:600;white-space:nowrap}
.sheet td.calc{background:var(--surface-2);text-align:right;padding:0 10px;white-space:nowrap}
.sheet td.calc.pos{background:var(--good-bg);color:var(--good);font-weight:600}
.sheet td.calc.neg{background:var(--bad-bg);color:var(--bad);font-weight:600}
.sheet td.calc.nil{color:var(--muted)}
.sheet td.calc.b-good{background:var(--good-bg);color:var(--good);font-weight:700}
.sheet td.calc.b-ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.sheet td.calc.b-warn{background:var(--warn-bg);color:var(--warn);font-weight:700}
.sheet td.calc.b-bad{background:var(--bad-bg);color:var(--bad);font-weight:700}
.sheet tfoot td{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--ink);border-bottom:0;font-weight:700;padding:0 10px;height:44px;text-align:right;white-space:nowrap}
.sheet tfoot td.dt{text-align:left}
.ci{width:100%;min-width:76px;height:32px;padding:0 8px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:right}
.ci:hover{border-color:var(--line)}
.ci:focus{outline:0;border-color:var(--ink);background:var(--surface)}
.ci.bad{border-color:var(--bad)}
.ci::placeholder{color:var(--muted);font-style:italic}
.wn{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--warn)}
.addday{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot-note{padding:12px 18px;border-top:1px solid var(--line-2);color:var(--muted);font-size:12.5px}

/* lançamento diário */
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.daybar .long{font:600 18px var(--font-display);margin-left:8px}
.daytbl td{padding:6px 8px}
.daytbl .ci{border-color:var(--line);background:var(--surface)}
.daytbl .ci:focus{border-color:var(--ink)}
.daytbl td.calc{background:var(--surface-2);text-align:right;white-space:nowrap}
.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 14px 14px}

/* formulários */
.cols{display:grid;grid-template-columns:minmax(0,640px) minmax(260px,1fr);gap:16px;align-items:start}
.form{display:grid;gap:16px;padding:20px}
.fld{display:grid;gap:6px;align-content:start}
.fld>label,.fld>.l{font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.err-msg{font-size:12.5px;color:var(--bad);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{height:32px;padding:0 14px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.recent{list-style:none;margin:0;padding:6px 0}
.recent li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line-2)}
.recent li:last-child{border-bottom:0}
.recent a{text-decoration:none;font-weight:600}
.empty{padding:36px 24px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--ink);font:600 17px var(--font-display)}
.bulkprev{display:flex;flex-wrap:wrap;gap:6px}
.bulkprev span{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px}
.bulkprev span.dup{border-color:var(--bad);color:var(--bad)}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;margin-top:4px}
.suffix{position:relative}
.suffix .in{padding-right:44px}
.suffix em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--btn);color:var(--btn-ink);padding:11px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .sum{grid-template-columns:1fr}
  .mgrid{border-left:0;border-top:1px solid var(--line-2)}
  .dsum{grid-template-columns:repeat(3,1fr)}
  .cols{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:0 8px 0 4px}.brand span{display:none}
  .nav{flex-direction:row;gap:4px}
  .side-foot{margin:0 0 0 auto;display:flex}
  .demo{display:none}
  .main{padding:18px 14px 44px}
  .ph h1{font-size:26px}
  .big{font-size:40px}
}
@media (max-width:640px){
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .dsum{grid-template-columns:repeat(2,1fr)}
  .two,.set-grid{grid-template-columns:1fr}
  .ctl.search{min-width:0;width:100%}
  .nav a span:not(.bdg){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">

'use strict';
/* =====================================================================
   PROTÓTIPO — Gestor de Tráfego Pago

const TODAY = '2026-09-20';
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf  = o => new Intl.NumberFormat('pt-BR', o);
const BRL = nf({style:'currency', currency:'BRL'});
const N2  = nf({minimumFractionDigits:2, maximumFractionDigits:2});
const N0  = nf({maximumFractionDigits:0});
const fBRL = v => v == null ? '—' : BRL.format(v);
const fN2  = v => v == null ? '—' : N2.format(v);

/* número digitado pelo usuário: aceita "4,18" e "4.18" */
function parseNum(str) {

/* ---------- estado ---------- */

/* ---------- dados de exemplo ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seed() {

  [[1,4.18,1,10,19],[2,6.64,0,45,56],[3,7.65,1,54,71],[4,5.06,0,77,55],[5,8.01,2,73,110],[6,6.6,3,77,113],[7,4.91,0,45,68],
   [8,24.8,13,217,324],[9,28.11,12,208,297],[10,32.38,6,243,393],[11,33.85,9,292,428],[12,34.7,10,321,480],[20,10,12,2,10]
  ].forEach(([d, invest, sales, clM, clS]) => state.entries.push({ cid:1, date:`2026-08-${pad(d)}`, invest, sales, rev:null, clM, clS, tax }));

  /* Demais criativos: simulados */
  const rnd = mulberry32(20260920);
  const PEND_FROM = '2026-09-18';               // faturamento dos últimos dias ainda não foi lançado
  const specs = [
    {id:2, name:'Depoimento cozinha 02', product:'Mini processador', format:'video', start:'2026-07-08', status:'scaling', base:34, roas:1.9, comm:9.2, growth:true},

    {id:10, name:'Reels rotina da manhã', product:'Luminária LED', format:'video', start:'2026-09-16', status:'testing', base:7, roas:1.4, comm:6.3},
    {id:11, name:'Story antes e depois gaveta', product:'Organizador de gavetas', format:'image', start:'2026-07-10', end:'2026-08-04', status:'discarded', base:20, roas:.8, comm:7.4}
  ];
  specs.forEach(sp => {
    state.creatives.push({ id:sp.id, name:sp.name, product:sp.product, format:sp.format, status:sp.status, start:sp.start, url:'', notes:'' });
    const n = diffDays(sp.start, sp.end || '2026-09-19');
    for (let i = 0; i <= n; i++) {
      const date = addDays(sp.start, i);
      const ramp = Math.min(1, .45 + i * .18);
      const grow = sp.growth ? Math.min(1.7, Math.pow(1.012, i)) : 1;
      const invest = Math.round(sp.base * ramp * grow * (.78 + .44 * rnd()) * 100) / 100;
      const clM = Math.max(1, Math.round(invest / (.09 + rnd() * .08)));
      const clS = Math.round(clM * (1.22 + rnd() * .35));
      const target = invest * (1 + tax) * sp.roas * (.62 + .76 * rnd());
      const sales = Math.max(0, Math.round(target / sp.comm));
      const rev = Math.round(sales * sp.comm * 100) / 100;
      state.entries.push({ cid:sp.id, date, invest, sales, rev: date >= PEND_FROM ? null : rev, clM, clS, tax });
    }
  });
}

/* =====================================================================
   REGRAS DE CÁLCULO (mesmas fórmulas da planilha)
   Custo c/ imposto = Investimento × (1 + imposto)       (coluna "Imposto")
   Lucro            = Faturamento − Custo c/ imposto
   CPC Meta/Shopee  = Investimento ÷ Cliques
   ROAS             = Faturamento ÷ Custo c/ imposto
   Totais: ROAS = Σ faturamento ÷ Σ custo (nunca a média dos ROAS diários)
   Dia sem faturamento lançado (null) fica FORA do lucro e do ROAS.
   ===================================================================== */
const costOf = e => e.invest * (1 + e.tax);
function calcRow(e) {
  const cost = costOf(e);
  return {
    cost,
    profit: e.rev == null ? null : e.rev - cost,
    cpcM: e.clM > 0 ? e.invest / e.clM : null,
    cpcS: e.clS > 0 ? e.invest / e.clS : null,
    roas: e.rev == null || cost <= 0 ? null : e.rev / cost
  };
}
function agg(list) {
  const a = { invest:0, cost:0, sales:0, clM:0, clS:0, rev:0, costClosed:0, days:list.length, pendingCost:0 };
  const pend = new Set();
  for (const e of list) {
    const c = costOf(e);
    a.invest += e.invest; a.cost += c; a.sales += e.sales; a.clM += e.clM; a.clS += e.clS;
    if (e.rev == null) { if (e.invest > 0) { pend.add(e.date); a.pendingCost += c; } }
    else { a.rev += e.rev; a.costClosed += c; }
  }
  a.pendingDays = pend.size;
  a.roas   = a.costClosed > 0 ? a.rev / a.costClosed : null;
  a.profit = a.costClosed > 0 ? a.rev - a.costClosed : null;
  a.cpcM = a.clM > 0 ? a.invest / a.clM : null;
  a.cpcS = a.clS > 0 ? a.invest / a.clS : null;
  a.cps  = a.sales > 0 ? a.cost / a.sales : null;
  return a;
}
const bandOf = r => {
  const s = state.settings;
  if (r == null) return 'wait';
  return r >= s.scale ? 'good' : r >= s.good ? 'ok' : r >= s.breakeven ? 'warn' : 'bad';
};
function decisionOf(a) {
  if (!a.days || a.cost === 0) return 'nodata';
  if (a.costClosed === 0) return 'pending';
  if (a.costClosed < state.settings.minSpend) return 'collect';
  return bandOf(a.roas);
}
const DEC = {
  good:['Escalar','good'], ok:['Manter','ok'], warn:['Observar','warn'], bad:['Pausar','bad'],
  collect:['Coletando dados','wait'], pending:['Aguardando faturamento','wait'], nodata:['Sem dados','wait']
};

/* ---------- componentes visuais ---------- */
const chip = k => `<span class="chip ${DEC[k][1]}">${DEC[k][0]}</span>`;
const stChip = s => `<span class="st ${s}">${STATUS[s]}</span>`;
function rulerPos(r) {
  const { breakeven:b, good:g, scale:c } = state.settings;
  if (r <= 0) return 0;
  if (r < b) return r / b * 25;
  if (r < g) return 25 + (r - b) / (g - b) * 25;
  if (r < c) return 50 + (r - g) / (c - g) * 25;
  return 75 + Math.min((r - c) / (c * .5), 1) * 25;
}
function ruler(r, cls = '') {
  const has = r != null;
  return `<span class="ruler ${cls}${has ? '' : ' off'}" ${has ? `role="img" aria-label="ROAS ${fN2(r)}"` : 'aria-hidden="true"'}><i></i><i></i><i></i><i></i>${has ? `<b style="left:${rulerPos(r).toFixed(1)}%"></b>` : ''}</span>`;
}
function delta(cur, prev, mode = 'neutral') {
  if (cur == null || prev == null || prev === 0) return '';
  const p = (cur - prev) / Math.abs(prev) * 100;
  if (Math.abs(p) < 0.5) return '<span class="dl n">= estável</span>';
  const up = p > 0;
  const cls = mode === 'neutral' ? 'n' : ((up === (mode === 'up')) ? 'g' : 'b');
  return `<span class="dl ${cls}">${up ? '▲' : '▼'} ${N0.format(Math.abs(p))}%</span>`;
}
const entriesOf = id => state.entries.filter(e => e.cid === id);
const getEntry = (id, date) => state.entries.find(e => e.cid === id && e.date === date);
const minDate = () => state.entries.reduce((m, e) => e.date < m ? e.date : m, TODAY);
const activeCreatives = () => state.creatives.filter(c => c.status === 'testing' || c.status === 'scaling');
/* =====================================================================
   DASHBOARD
   ===================================================================== */
const view = () => $('#view');
const PRESETS = [['today','Hoje'],['yesterday','Ontem'],['7d','Últimos 7 dias'],['14d','Últimos 14 dias'],['30d','Últimos 30 dias'],['month','Este mês'],['lastmonth','Mês passado'],['all','Todo o período'],['custom','Personalizado']];
const F = { preset:'30d', from:TODAY, to:TODAY, ids:new Set(), status:'all', product:'all', band:'all', sort:{k:'profit', dir:-1} };
let chartRO = null;

function periodRange() {
  switch (F.preset) {
    case 'today': return [TODAY, TODAY];
    case 'yesterday': { const y = addDays(TODAY, -1); return [y, y]; }
    case '7d': return [addDays(TODAY, -6), TODAY];
    case '14d': return [addDays(TODAY, -13), TODAY];
    case '30d': return [addDays(TODAY, -29), TODAY];
    case 'month': return [TODAY.slice(0, 8) + '01', TODAY];
    case 'lastmonth': { const first = TODAY.slice(0, 8) + '01'; const d = D(first); d.setUTCMonth(d.getUTCMonth() - 1); return [iso(d), addDays(first, -1)]; }
    case 'all': return [minDate(), TODAY];
    default: return F.from <= F.to ? [F.from, F.to] : [F.to, F.from];
  }
}
const presetLabel = () => (PRESETS.find(p => p[0] === F.preset) || [])[1];
const isDefaultFilters = () => F.preset === '30d' && !F.ids.size && F.status === 'all' && F.product === 'all' && F.band === 'all';

function dashData() {
  const [from, to] = periodRange();
  const len = diffDays(from, to) + 1;
  const inR = (e, a, b) => e.date >= a && e.date <= b;
  const cs = state.creatives.filter(c => (F.status === 'all' || c.status === F.status) && (F.product === 'all' || c.product === F.product) && (!F.ids.size || F.ids.has(c.id)));
  const rows = cs.map(c => { const a = agg(state.entries.filter(e => e.cid === c.id && inR(e, from, to))); return { c, a, dec: decisionOf(a) }; }).filter(r => r.a.days > 0);
  const rowsF = F.band === 'all' ? rows : rows.filter(r => r.dec === F.band);
  const ids = new Set(rowsF.map(r => r.c.id));
  const cur = state.entries.filter(e => ids.has(e.cid) && inR(e, from, to));
  const total = agg(cur);
  let prev = null;
  if (F.preset !== 'all') {
    const pTo = addDays(from, -1), pFrom = addDays(pTo, -(len - 1));
    prev = agg(state.entries.filter(e => ids.has(e.cid) && inR(e, pFrom, pTo)));
    if (!prev.days) prev = null;
  }
  const days = [];
  for (let i = 0; i < len; i++) {
    const date = addDays(from, i);
    const es = cur.filter(e => e.date === date);
    if (!es.length) { days.push({ date, empty:true }); continue; }
    const a = agg(es);
    days.push({ date, cost:a.cost, rev:a.costClosed > 0 ? a.rev : null, profit:a.profit, roas:a.roas, pending:a.costClosed === 0 });
  }
  return { from, to, len, rows:rowsF, total, prev, days };
}

  $('#f-from').addEventListener('change', rangeChange);

  $('#dash-res').addEventListener('click', e => {

function updateDashboard() {
  const d = dashData();
  $('#lbl-period').innerHTML = `${presetLabel()} <small>${fDay(d.from)} – ${fDate(d.to)}</small>`;
  $('#f-from').value = d.from; $('#f-to').value = d.to;
  $$('#dd-period .dd-item').forEach(b => b.classList.toggle('on', b.dataset.preset === F.preset));
  $$('#cr-list input').forEach(i => i.checked = F.ids.has(+i.value));
  const one = F.ids.size === 1 ? state.creatives.find(c => F.ids.has(c.id)) : null;
  $('#lbl-cr').textContent = !F.ids.size ? 'Todos' : one ? one.name : `${F.ids.size} selecionados`;
  $('#f-status').value = F.status; $('#f-product').value = F.product; $('#f-band').value = F.band;
  $('#f-clear').hidden = isDefaultFilters();
  $('#dash-res').innerHTML = resultsHTML(d);
  if (chartRO) { chartRO.disconnect(); chartRO = null; }
  const box = $('#chart');
  if (box) {
    drawChart(box, d.days);
    if (window.ResizeObserver) { let w = box.clientWidth; chartRO = new ResizeObserver(() => { if (Math.abs(box.clientWidth - w) > 4) { w = box.clientWidth; drawChart(box, d.days); } }); chartRO.observe(box); }
  }
}

function resultsHTML(d) {
  if (!d.rows.length) {
    return `<div class="panel"><div class="empty"><strong>Nenhum lançamento encontrado</strong><span>Não há dados neste período com os filtros escolhidos.</span><button class="btn ghost" type="button" data-reset>Limpar filtros</button></div></div>`;
  }
  const t = d.total, p = d.prev, s = state.settings;
  const dec = decisionOf(t);
  const profCls = t.profit == null ? 'nil' : t.profit >= 0 ? 'good' : 'bad';
  const cells = [
    ['Investimento', fBRL(t.invest), `com imposto ${fBRL(t.cost)}`, delta(t.invest, p?.invest)],
    ['Faturamento', t.costClosed > 0 ? fBRL(t.rev) : '—', t.pendingDays ? `${t.pendingDays} ${t.pendingDays > 1 ? 'dias pendentes' : 'dia pendente'}` : '', delta(t.rev, p?.rev, 'up')],
    ['Vendas', fN0(t.sales), '', delta(t.sales, p?.sales, 'up')],
    ['Custo por venda', fBRL(t.cps), 'custo com imposto ÷ vendas', delta(t.cps, p?.cps, 'down')],
    ['Cliques Meta', fN0(t.clM), '', delta(t.clM, p?.clM)],
    ['Cliques Shopee', fN0(t.clS), '', delta(t.clS, p?.clS)],
    ['CPC Meta', fBRL(t.cpcM), 'investimento ÷ cliques', delta(t.cpcM, p?.cpcM, 'down')],
    ['CPC Shopee', fBRL(t.cpcS), 'investimento ÷ cliques', delta(t.cpcS, p?.cpcS, 'down')]
  ];
  const note = t.pendingDays ? `<div class="note">${icon('info', 16)}<span>Faturamento ainda não lançado em ${t.pendingDays} ${t.pendingDays > 1 ? 'dias' : 'dia'} (${fBRL(t.pendingCost)} investidos). Esses dias ficam fora do lucro e do ROAS até você preencher.</span></div>` : '';
  const sorted = [...d.rows].sort((x, y) => {
    const g = r => ({ profit:r.a.profit, roas:r.a.roas, cost:r.a.cost, sales:r.a.sales })[F.sort.k];
    const a = g(x), b = g(y);
    if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
    return (a - b) * F.sort.dir;
  });
  const th = (k, label, cls = '') => `<th class="${cls}" data-sort="${k}" aria-sort="${F.sort.k === k ? (F.sort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}${F.sort.k === k ? `<span class="ar">${F.sort.dir < 0 ? '↓' : '↑'}</span>` : ''}</th>`;
  return `
  <section class="panel sum" aria-label="Resumo do período">
    <div class="hero">
      <div class="lbl">Lucro no período</div>
      <div class="big ${profCls}">${fBRL(t.profit)}</div>
      <div class="hero-sub">${delta(t.profit, p?.profit, 'up')}${p ? '<span class="mut">vs período anterior</span>' : ''}</div>
      <div class="hero-roas">
        <div class="rrow"><span class="lbl">ROAS</span><strong>${fN2(t.roas)}</strong>${chip(dec)}</div>
        ${ruler(t.roas, 'wide')}
        <div class="ticks"><span style="left:25%">${fN2(s.breakeven)}</span><span style="left:50%">${fN2(s.good)}</span><span style="left:75%">${fN2(s.scale)}</span></div>
      </div>
      ${note}
    </div>
    <div class="mgrid">${cells.map(c => `<div><span class="lbl">${c[0]}</span><span class="v">${c[1]}</span><span class="s">${c[2]}</span>${c[3]}</div>`).join('')}</div>
  </section>
  <section class="panel" aria-label="Evolução diária">
    <div class="panel-h"><h2>Custo × faturamento por dia</h2>
      <div class="legend"><span><i class="dot ln" style="background:var(--ink-2)"></i>Custo com imposto</span><span><i class="dot ln" style="background:var(--good-seg)"></i>Faturamento</span><span><i class="dot good"></i>Lucro do dia</span><span><i class="dot bad"></i>Prejuízo do dia</span></div>
    </div>
    <div class="chart" id="chart"></div>
  </section>
  <section class="panel" aria-label="Decisão por criativo">
    <div class="panel-h"><h2>Decisão por criativo <span class="sub">${d.rows.length} no período</span></h2>
      <div class="legend"><span><i class="dot bad"></i>Pausar &lt; ${fN2(s.breakeven)}</span><span><i class="dot warn"></i>Observar ${fN2(s.breakeven)}–${fN2(s.good)}</span><span><i class="dot ok"></i>Manter ${fN2(s.good)}–${fN2(s.scale)}</span><span><i class="dot good"></i>Escalar ≥ ${fN2(s.scale)}</span></div>
    </div>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Criativo</th><th>Status</th>${th('cost', 'Custo c/ imposto', 'num')}<th class="num">Faturamento</th>${th('profit', 'Lucro', 'num')}${th('sales', 'Vendas', 'num')}${th('roas', 'ROAS')}<th>Ação sugerida</th></tr></thead>
      <tbody>${sorted.map(r => { const a = r.a, c = r.c; const pc = a.profit == null ? '' : a.profit >= 0 ? 'good' : 'bad';
        return `<tr class="click" data-id="${c.id}" title="Abrir ${esc(c.name)}"><td><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.product)} · ${FORMAT[c.format]}</div></td><td>${stChip(c.status)}</td><td class="num">${fBRL(a.cost)}</td><td class="num">${a.costClosed > 0 ? fBRL(a.rev) : '—'}</td><td class="num prof ${pc}">${fBRL(a.profit)}</td><td class="num">${fN0(a.sales)}</td><td class="rz"><span class="rv">${fN2(a.roas)}</span>${ruler(a.roas)}</td><td>${chip(r.dec)}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </section>`;
}

/* ---------- gráfico: linhas (custo, faturamento) + barras (lucro do dia) ---------- */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
const short = v => Math.abs(v) >= 1000 ? `${(v / 1000).toFixed(v % 1000 ? 1 : 0).replace('.', ',')} mil` : N0.format(v);

function drawChart(el, days) {
  const W = Math.max(320, el.clientWidth - 20), H = 336;
  const L = 52, R = 8, T1 = 12, B1 = 190, T2 = 226, B2 = 300, XL = 322;
  const n = days.length, step = (W - L - R) / n;
  const x = i => L + step * (i + .5);
  const real = days.filter(d => !d.empty);
  const max = niceMax(Math.max(1, ...real.flatMap(d => [d.cost, d.rev || 0])));
  const y1 = v => B1 - (v / max) * (B1 - T1);
  const pmax = Math.max(1, ...real.filter(d => d.profit != null).map(d => Math.abs(d.profit)));
  const mid = (T2 + B2) / 2, y2 = v => mid - (v / pmax) * ((B2 - T2) / 2);
  const line = get => { let s = '', pen = false; days.forEach((d, i) => { const v = d.empty ? null : get(d); if (v == null) { pen = false; return; } s += `${pen ? 'L' : 'M'}${x(i).toFixed(1)} ${y1(v).toFixed(1)}`; pen = true; }); return s; };
  let g = '';
  [0, .5, 1].forEach(f => { const v = max * f, y = y1(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">R$ ${short(v)}</text>`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}" stroke="var(--line)"/><text x="${L - 8}" y="${mid + 4}" text-anchor="end">Lucro</text>`;
  /* faixas de "faturamento pendente" */
  let i = 0, hatch = '';
  while (i < n) { if (!days[i].empty && days[i].pending) { let j = i; while (j + 1 < n && !days[j + 1].empty && days[j + 1].pending) j++; const x0 = L + step * i, w = step * (j - i + 1);
    hatch += `<rect x="${x0}" y="${T1}" width="${w}" height="${B2 - T1}" fill="url(#hatch)"/>${w > 96 ? `<text x="${x0 + w / 2}" y="${T1 + 12}" text-anchor="middle">faturamento pendente</text>` : ''}`; i = j + 1; } else i++; }
  const bw = Math.max(2, Math.min(22, step * .62));
  const bars = days.map((d, k) => d.empty || d.profit == null ? '' : `<rect x="${(x(k) - bw / 2).toFixed(1)}" y="${Math.min(mid, y2(d.profit)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y2(d.profit) - mid)).toFixed(1)}" rx="2" fill="${d.profit >= 0 ? 'var(--good-seg)' : 'var(--bad-seg)'}"/>`).join('');
  const stride = Math.max(1, Math.ceil(n / Math.floor((W - L) / 58)));
  const xl = days.map((d, k) => k % stride === 0 ? `<text x="${x(k).toFixed(1)}" y="${XL}" text-anchor="middle">${fDay(d.date)}</text>` : '').join('');
  const dots = days.map((d, k) => d.empty || n > 45 ? '' : `<circle cx="${x(k).toFixed(1)}" cy="${y1(d.cost).toFixed(1)}" r="2.2" fill="var(--ink-2)"/>${d.rev != null ? `<circle cx="${x(k).toFixed(1)}" cy="${y1(d.rev).toFixed(1)}" r="2.2" fill="var(--good-seg)"/>` : ''}`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico diário de custo, faturamento e lucro">
    <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--hatch)" stroke-width="2.2" opacity=".55"/></pattern></defs>
    ${g}${hatch}${bars}
    <path d="${line(d => d.cost)}" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${line(d => d.rev)}" fill="none" stroke="var(--good-seg)" stroke-width="2.4" stroke-linejoin="round"/>
    ${dots}${xl}
    <line id="cur" y1="${T1}" y2="${B2}" stroke="var(--ink)" stroke-dasharray="3 3" opacity="0" />
    <rect id="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const tip = $('.tip', el), cur = $('#cur', el), hit = $('#hit', el);
  const show = ev => {
    const r = hit.getBoundingClientRect(); const k = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - r.left) / r.width * n)));
    const d = days[k]; const cx = x(k);
    cur.setAttribute('x1', cx); cur.setAttribute('x2', cx); cur.setAttribute('opacity', '.5');
    tip.innerHTML = d.empty ? `<b>${fDate(d.date)}</b><span class="mut">Sem lançamentos</span>` :
      `<b>${fDate(d.date)}</b><div><span class="mut">Custo c/ imposto</span><span>${fBRL(d.cost)}</span></div><div><span class="mut">Faturamento</span><span>${d.rev == null ? 'pendente' : fBRL(d.rev)}</span></div><div><span class="mut">Lucro</span><span>${fBRL(d.profit)}</span></div><div><span class="mut">ROAS</span><span>${fN2(d.roas)}</span></div>`;
    tip.hidden = false;
    const scale = el.clientWidth / (W + 20), px = (cx * scale) + 10;
    tip.style.left = (k > n / 2 ? px - tip.offsetWidth - 12 : px + 12) + 'px'; tip.style.top = '14px';
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; cur.setAttribute('opacity', '0'); });
}

function libBody() {
  const q = L.q.trim().toLowerCase();
  const rows = state.creatives.map(c => ({ c, a: agg(entriesOf(c.id)) }))
    .filter(r => (L.status === 'all' || r.c.status === L.status) && (!q || (r.c.name + ' ' + r.c.product).toLowerCase().includes(q)));
  const key = { profit:r => r.a.profit, roas:r => r.a.roas, invest:r => r.a.invest };
  if (L.sort === 'recent') rows.sort((x, y) => y.c.start.localeCompare(x.c.start) || y.c.id - x.c.id);
  else rows.sort((x, y) => { const a = key[L.sort](x), b = key[L.sort](y); if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1; return b - a; });
  $('#lib-sub').textContent = `${rows.length} de ${state.creatives.length} criativos`;
  $('#lib-body').innerHTML = !rows.length
    ? `<div class="empty"><strong>Nenhum criativo encontrado</strong><span>Tente outra busca ou cadastre um novo criativo.</span><a class="btn" href="#/cadastro">${icon('plus', 16)}Cadastrar criativo</a></div>`
    : `<table class="tbl"><thead><tr><th>Criativo</th><th>Status</th><th>Início</th><th class="num">Investimento</th><th class="num">Faturamento</th><th class="num">Lucro</th><th>ROAS</th><th>Ação sugerida</th></tr></thead><tbody>${rows.map(({ c, a }) => {
        const pc = a.profit == null ? '' : a.profit >= 0 ? 'good' : 'bad';
        return `<tr class="click" data-id="${c.id}" title="Abrir ${esc(c.name)}"><td><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.product)} · ${FORMAT[c.format]}</div></td><td>${stChip(c.status)}</td><td>${fDate(c.start)}</td><td class="num">${fBRL(a.invest)}</td><td class="num">${a.costClosed > 0 ? fBRL(a.rev) : '—'}</td><td class="num prof ${pc}">${fBRL(a.profit)}</td><td class="rz"><span class="rv">${fN2(a.roas)}</span>${ruler(a.roas)}</td><td>${chip(decisionOf(a))}</td></tr>`; }).join('')}</tbody></table>`;
}

}
function rowHTML(e) {

    ${inp('clM', e.clM, 'numeric')}${inp('clS', e.clS, 'numeric')}
    <td class="calc" data-c="cpcM"></td><td class="calc" data-c="cpcS"></td><td class="calc" data-c="roas"></td></tr>`;
}
function paintRow(tr, e) {
  const k = calcRow(e);

  set('cost', fN2(k.cost)); set('cpcM', fN2(k.cpcM)); set('cpcS', fN2(k.cpcS));
  set('profit', fN2(k.profit), k.profit == null ? 'nil' : k.profit > 0 ? 'pos' : k.profit < 0 ? 'neg' : '');
  set('roas', fN2(k.roas), k.roas == null ? 'nil' : 'b-' + bandOf(k.roas));
  $('.wn', tr).hidden = !(e.clS > 0 && e.sales > e.clS);
}

/* =====================================================================
   LANÇAMENTO DIÁRIO — um dia, todos os criativos ativos numa tela só
   ===================================================================== */
const DY = { date: TODAY };
function pageDaily() {
  view().innerHTML = `
  <div class="ph"><div><h1>Criativos</h1><p class="sub">Lance o dia de todos os criativos ativos numa tela só.</p></div><a class="btn" href="#/cadastro">${icon('plus', 16)}Cadastrar criativo</a></div>
  ${tabsHTML('day')}
  <div class="daybar">
    <button class="btn ghost sm" id="dy-prev" type="button" aria-label="Dia anterior">${icon('left', 16)}</button>
    <input type="date" class="in sm" id="dy-date" max="${TODAY}" aria-label="Data do lançamento">
    <button class="btn ghost sm" id="dy-next" type="button" aria-label="Próximo dia">${icon('right', 16)}</button>
    <button class="btn ghost sm" id="dy-today" type="button">Hoje</button>
    <span class="long" id="dy-long"></span>
  </div>
  <section class="panel"><div class="scroll" id="dy-body"></div>
    <div class="savebar"><span id="dy-count" class="mut"></span><button class="btn" id="dy-save" type="button">${icon('check', 16)}Salvar lançamentos</button></div></section>`;
  const go = d => { if (!d || d > TODAY) return; DY.date = d; renderDay(); };
  $('#dy-prev').addEventListener('click', () => go(addDays(DY.date, -1)));
  $('#dy-next').addEventListener('click', () => go(addDays(DY.date, 1)));
  $('#dy-today').addEventListener('click', () => go(TODAY));
  $('#dy-date').addEventListener('change', e => go(e.target.value));
  $('#dy-save').addEventListener('click', saveDay);
  const body = $('#dy-body');
  body.addEventListener('input', ev => { const tr = ev.target.closest('tr[data-cid]'); if (tr) paintDayRow(tr); countDay(); });
  body.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || !ev.target.matches('input[data-f]')) return;
    ev.preventDefault();
    const nxt = ev.target.closest('tr').nextElementSibling;
    const t = nxt ? $(`input[data-f="${ev.target.dataset.f}"]`, nxt) : null;
    if (t) { t.focus(); t.select(); } else $('#dy-save').focus();
  });
  renderDay();
}
function renderDay() {
  const date = DY.date, cs = activeCreatives();
  $('#dy-date').value = date; $('#dy-next').disabled = date >= TODAY;
  const ld = longDate(date); $('#dy-long').textContent = ld.charAt(0).toUpperCase() + ld.slice(1) + (date === TODAY ? ' (hoje)' : '');
  if (!cs.length) { $('#dy-body').innerHTML = `<div class="empty"><strong>Nenhum criativo ativo</strong><span>Cadastre um criativo ou mude o status de um existente para Testando ou Escalando.</span><a class="btn" href="#/cadastro">Cadastrar criativo</a></div>`; $('#dy-save').disabled = true; $('#dy-count').textContent = ''; return; }
  const cell = (f, val, mode, ph) => `<td><input class="ci" data-f="${f}" inputmode="${mode}" value="${val}" placeholder="${ph}"></td>`;
  $('#dy-body').innerHTML = `<table class="tbl daytbl"><thead><tr><th>Criativo</th><th class="num">Investimento (R$)</th><th class="num">Vendas</th><th class="num">Faturamento (R$)</th><th class="num">Cliques Meta</th><th class="num">Cliques Shopee</th><th class="num">Custo c/ imposto</th><th class="num">ROAS</th></tr></thead><tbody>${cs.map(c => {
    const e = getEntry(c.id, date);
    return `<tr data-cid="${c.id}"><td><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.product)}</div></td>
      ${cell('invest', e ? fIn(e.invest) : '', 'decimal', '0,00')}${cell('sales', e ? e.sales : '', 'numeric', '0')}${cell('rev', e ? fIn(e.rev) : '', 'decimal', 'pendente')}${cell('clM', e ? e.clM : '', 'numeric', '0')}${cell('clS', e ? e.clS : '', 'numeric', '0')}
      <td class="calc" data-c="cost">—</td><td class="calc" data-c="roas">—</td></tr>`; }).join('')}</tbody></table>`;
  $$('#dy-body tr[data-cid]').forEach(paintDayRow); countDay();
}
function paintDayRow(tr) {
  const e = getEntry(+tr.dataset.cid, DY.date);
  const inv = parseNum($('[data-f="invest"]', tr).value), rev = parseNum($('[data-f="rev"]', tr).value);
  const tax = e ? e.tax : state.settings.tax;
  const cost = inv == null || Number.isNaN(inv) ? null : inv * (1 + tax);
  const roas = cost && rev != null && !Number.isNaN(rev) ? rev / cost : null;
  $('[data-c="cost"]', tr).textContent = fN2(cost);
  const r = $('[data-c="roas"]', tr); r.textContent = fN2(roas); r.className = 'calc ' + (roas == null ? 'nil' : 'b-' + bandOf(roas));
}
const rowFilled = tr => $('[data-f="invest"]', tr).value.trim() !== '';
function countDay() {
  const rows = $$('#dy-body tr[data-cid]'), n = rows.filter(rowFilled).length;
  $('#dy-count').textContent = `${n} de ${rows.length} criativos preenchidos`;
  $('#dy-save').disabled = n === 0;
}
function saveDay() {
  const rows = $$('#dy-body tr[data-cid]'); const out = []; let bad = null;
  $$('#dy-body .ci.bad').forEach(i => i.classList.remove('bad'));
  for (const tr of rows) {
    const vals = {}; let any = false, invalid = false;
    $$('input[data-f]', tr).forEach(i => { const v = parseNum(i.value); vals[i.dataset.f] = v; if (i.value.trim() !== '') any = true; if (Number.isNaN(v) || (v != null && v < 0)) { i.classList.add('bad'); invalid = true; } });
    if (!any) continue;
    const name = $('.nm', tr).textContent;
    if (invalid) { bad = bad || `Confira os números de ${name}.`; continue; }
    if (vals.invest == null) { $('[data-f="invest"]', tr).classList.add('bad'); bad = bad || `Informe o investimento de ${name}.`; continue; }
    out.push({ cid:+tr.dataset.cid, vals });
  }
  if (bad) { toast(bad); return; }
  out.forEach(({ cid, vals }) => {
    let e = getEntry(cid, DY.date);
    if (!e) { e = { cid, date:DY.date, invest:0, sales:0, rev:null, clM:0, clS:0, tax:state.settings.tax }; state.entries.push(e); }
    e.invest = vals.invest; e.sales = Math.round(vals.sales ?? 0); e.rev = vals.rev; e.clM = Math.round(vals.clM ?? 0); e.clS = Math.round(vals.clS ?? 0);
  });
  toast(`${out.length} ${out.length === 1 ? 'lançamento salvo' : 'lançamentos salvos'} em ${fDate(DY.date)}`);
  updateBadge(); renderDay();
}

const bulkNames = () => R.bulk.split('\n').map(s => s.trim()).filter(Boolean);
function bulkPreview() {

function paintRecent() {

}
function fail(msg, sel) { const e = $('#r-err'); e.textContent = msg; e.hidden = false; const i = $(sel); if (i) { i.classList.add('err'); i.focus(); } }
function submit(goDaily) {

/* =====================================================================
   ROTEADOR, TEMA, TOAST
   ===================================================================== */
const ROUTES = [
  [/^#\/dashboard$/, pageDashboard, 'dash'], [/^#\/criativos$/, pageLibrary, 'crea'], [/^#\/lancamento$/, pageDaily, 'crea'],
  [/^#\/criativo\/(\d+)$/, pageDetail, 'crea'], [/^#\/cadastro$/, pageRegister, 'reg'], [/^#\/config$/, pageSettings, 'cfg']
];
function route() {
  const h = location.hash || '#/dashboard';
  if (chartRO) { chartRO.disconnect(); chartRO = null; }
  for (const [re, fn, nav] of ROUTES) {
    const m = h.match(re);
    if (m) { $$('#nav a').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === nav)); $$('#nav a[aria-current]').forEach(a => a.setAttribute('aria-current', 'page')); fn(...m.slice(1)); window.scrollTo(0, 0); updateBadge(); return; }
  }
  location.hash = '#/dashboard';
}
function updateBadge() {
  const n = activeCreatives().filter(c => !getEntry(c.id, TODAY)).length, b = $('#badge');
  b.hidden = !n; b.textContent = n; b.title = `${n} criativos ativos sem lançamento hoje`;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800); }
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };

document.addEventListener('click', e => {
  const btn = e.target.closest('.dd-btn');
  $$('.dd.open').forEach(d => { if (!d.contains(e.target)) d.classList.remove('open'); });
  if (btn) { const dd = btn.closest('.dd'), open = !dd.classList.contains('open'); dd.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.dd.open').forEach(d => d.classList.remove('open')); });
(function init() {
  try { const s = localStorage.getItem('gt-theme'); if (s) document.documentElement.dataset.theme = s; } catch (e) { /* sem storage: segue o tema do sistema */ }
  seed();
  $$('[data-ic]').forEach(el => el.outerHTML = icon(el.dataset.ic));
  $('#theme').addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('gt-theme', next); } catch (e) { /* ignora */ } paintTheme(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) { /* navegador antigo */ }
  paintTheme();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
