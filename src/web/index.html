<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de Tráfego Pago</title>
<style>
:root{--bg:#EBEFED;--surface:#fff;--ink:#16201C;--muted:#647570;--line:#D8DFDC;--btn:#16201C;--btn-ink:#fff;
--good:#0B8A4C;--good-bg:#D9F2E4;--good-seg:#2FBF7A;--ok:#0E76B8;--ok-bg:#D8ECF9;--ok-seg:#3AA6E6;
--warn:#8A5F00;--warn-bg:#F6E8BE;--warn-seg:#E2AE1F;--bad:#B72929;--bad-bg:#F8DADA;--bad-seg:#E5595B;--wait-bg:#E3E9E6;--wait:#5D6D68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:0}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:17px;padding:4px 10px 16px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:9px 10px;border-radius:9px;text-decoration:none;color:#3A4843;font-weight:600}
.nav a[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
.main{padding:26px 28px 56px;min-width:0}
.wrap{max-width:1100px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:28px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.panel-b{padding:18px}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ctl{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.ctl input,.ctl select{border:0;background:transparent;outline:0}
.ctl.search{min-width:240px}.ctl.search input{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.in{height:40px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea.in{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.in.err{border-color:var(--bad)}
.fld{display:grid;gap:6px;margin-bottom:14px}.fld>label{font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.err-msg{font-size:13px;color:var(--bad);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:#F4F7F6;gap:2px}
.seg button{height:32px;padding:0 14px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #E8EDEB;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F4F7F6}
.tbl td.num,.tbl th.num{text-align:right}
.nm{font-weight:700}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.wait{background:var(--wait-bg);color:var(--wait)}
.ruler{position:relative;display:inline-grid;grid-template-columns:repeat(4,1fr);gap:2px;width:104px;height:8px;vertical-align:middle}
.ruler i{border-radius:2px}.ruler i:nth-child(1){background:var(--bad-seg)}.ruler i:nth-child(2){background:var(--warn-seg)}
.ruler i:nth-child(3){background:var(--ok-seg)}.ruler i:nth-child(4){background:var(--good-seg)}
.ruler b{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.ruler.off i{background:var(--line)}
.mut{color:var(--muted)}.prof.good{color:var(--good)}.prof.bad{color:var(--bad)}
.recent{list-style:none;margin:0;padding:6px 0}.recent li{display:flex;justify-content:space-between;gap:10px;padding:10px 18px;border-bottom:1px solid #E8EDEB}
.empty{padding:36px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--btn);color:var(--btn-ink);padding:11px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cols{display:grid;grid-template-columns:minmax(0,640px) minmax(260px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static;flex-direction:row;align-items:center}.cols,.two{grid-template-columns:1fr}}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.daybar .long{font-weight:700;font-size:17px;margin-left:8px}
.daytbl td{padding:6px 8px}
.ci{width:100%;min-width:76px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right}
.ci:focus{outline:0;border-color:var(--ink)}
.ci.bad{border-color:var(--bad)}
.ci::placeholder{color:var(--muted);font-style:italic}
.daytbl td.calc{background:#F4F7F6;text-align:right;white-space:nowrap;padding:0 10px}
.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.bulkprev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bulkprev span{background:#F4F7F6;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px}
.bulkprev span.dup{border-color:var(--bad);color:var(--bad)}
.warnbox{display:flex;gap:8px;align-items:flex-start;margin:0 18px 12px;font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:9px;padding:9px 10px}
.scroll{overflow:auto;max-width:100%}
.panel-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #E8EDEB}
.panel-h h2{margin:0;font-size:17px}
.pill{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#F4F7F6;cursor:pointer;font-weight:600;font-size:12.5px}
.pill[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.sheet{width:100%;border-collapse:collapse;min-width:980px}
.sheet th{font-size:12px;color:var(--muted);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet th.l,.sheet td.dt{text-align:left}
.sheet td{padding:6px 8px;border-bottom:1px solid #E8EDEB;vertical-align:middle}
.sheet td.calc{background:#F4F7F6;text-align:right;white-space:nowrap;padding:0 10px;font-variant-numeric:tabular-nums}
.sheet td.calc.nil{color:var(--muted);font-style:italic}
.sheet tfoot td{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--ink);font-weight:800;text-align:right;white-space:nowrap;padding:12px 10px}
.sheet tfoot td.dt{text-align:left}
.sheet td.dt{white-space:nowrap;font-weight:700}
.sheet .dia1{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:1px 8px}
.foot-note{padding:12px 18px;color:var(--muted);font-size:12.5px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addday{display:flex;gap:8px;align-items:center;margin-left:auto}
.in.sm{height:34px;width:auto}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.del{border:0;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;border-radius:7px}
.del:hover{background:var(--bad-bg)}
.sheet tr.todel{opacity:.55}
.sheet tr.todel input{text-decoration:line-through}
.sheet tr.dirty td.dt{box-shadow:inset 3px 0 0 var(--warn-seg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700}
.kpi .big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .big.good{color:var(--good)}.kpi .big.bad{color:var(--bad)}
.kpi .sub2{font-size:12px;color:var(--muted)}
.dl{font-size:12px;font-weight:800}.dl.g{color:var(--good)}.dl.b{color:var(--bad)}.dl.n{color:var(--muted)}
.chart{width:100%;height:220px;display:block}
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:42px;left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.dd.open .dd-menu{display:block}
.dd-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.dd-item:hover{background:#F4F7F6}.dd-item.on{font-weight:800;background:#F4F7F6}
.dd-list{max-height:220px;overflow:auto;display:grid;gap:2px;margin:6px 0}
.dd-opt{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px}
.dd-opt small{color:var(--muted);margin-left:auto}
.lnk{border:0;background:transparent;color:var(--ok);font-weight:700;cursor:pointer}
th[data-sort]{cursor:pointer;user-select:none}.ar{margin-left:4px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Gestor de Tráfego</div>
    <nav class="nav" aria-label="Principal">
      <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#/criativos" data-nav="criativos">Criativos</a>
      <a href="#/cadastro" data-nav="cadastro">Cadastro</a>
      <a href="#/lancamento" data-nav="lancamento">Lançamento</a>
      <a href="#/config" data-nav="config">Config</a>
    </nav>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import * as Calc from "/shared/calc.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view = () => $("#view");
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); };
const fDate = (s) => { const [y, m, d] = String(s).split("-"); return `${d}/${m}/${y.slice(2)}`; };
const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
// Usa o módulo único de cálculo servido pelo servidor (ao-vivo + formato BR).
const fBRL = (cents) => Calc.formatBRL(cents);

const FORMAT = { video: "Vídeo", image: "Imagem", carousel: "Carrossel" };
const STATUS = { ativo: "Ativo", escalando: "Escalando", pausado: "Pausado", encerrado: "Encerrado" };

function chipFor(h) {
  const map = { "Saudável": "ok", "Atenção": "warn", "Escalando": "good", "Pausado": "bad", "Encerrado": "bad", "Sem dados": "wait" };
  return `<span class="chip ${map[h.statusDisplay] ?? "wait"}">${esc(h.statusDisplay)}</span>`;
}
function rulerFor(h) {
  const pos = { vermelho: 12, amarelo: 37, azul: 62, verde: 87 };
  if (h.ruler === "cinza") return `<span class="ruler off" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
  return `<span class="ruler" role="img" aria-label="Saúde ${esc(h.statusDisplay)}"><i></i><i></i><i></i><i></i><b style="left:${pos[h.ruler] ?? 62}%"></b></span>`;
}
const profitClass = (cents) => cents == null ? "" : cents >= 0 ? "good" : "bad";
async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.error || "erro"); e.status = res.status; e.body = body; throw e; }
  return body;
}

// ---------- Biblioteca (T5: busca + status + ordenação lucro/ROAS/custo/vendas) ----------
const L = { q: "", status: "all", sort: "recent" };
const fRoas = (n) => Calc.formatRoas(n);
async function pageLibrary() {
  view().innerHTML = `
  <div class="ph"><div><h1>Criativos</h1><p class="sub" id="lib-sub">Biblioteca — busque, filtre e compare</p></div><a class="btn" href="#/cadastro">+ Cadastrar criativo</a></div>
  <div class="fb">
    <label class="ctl search"><input id="lib-q" placeholder="Buscar por nome ou produto" value="${esc(L.q)}" aria-label="Buscar criativo"></label>
    <label class="ctl">Status <select id="lib-status"><option value="all">Todos</option>${Object.entries(STATUS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
    <label class="ctl">Ordenar <select id="lib-sort"><option value="recent">Mais recentes</option><option value="name">Nome A–Z</option><option value="profit">Maior lucro</option><option value="roas">Maior ROAS-equiv.</option><option value="cost">Maior custo</option><option value="sales">Mais vendas</option></select></label>
  </div>
  <section class="panel"><div class="panel-b" id="lib-body">Carregando…</div></section>`;
  $("#lib-status").value = L.status; $("#lib-sort").value = L.sort;
  $("#lib-q").addEventListener("input", (e) => { L.q = e.target.value; libBody(); });
  $("#lib-status").addEventListener("change", (e) => { L.status = e.target.value; libBody(); });
  $("#lib-sort").addEventListener("change", (e) => { L.sort = e.target.value; libBody(); });
  $("#lib-body").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-id]"); if (tr) location.hash = "#/criativo/" + tr.dataset.id; });
  await libBody();
}
async function libBody() {
  const box = $("#lib-body");
  try {
    const qs = new URLSearchParams();
    if (L.q.trim()) qs.set("q", L.q.trim());
    if (L.status !== "all") qs.set("status", L.status);
    // Ordenação no servidor (contrato ?sort=profit|roas|cost|sales|name|recent).
    if (L.sort && L.sort !== "recent") qs.set("sort", L.sort);
    const { data } = await api("/api/creatives?" + qs.toString());
    const rows = [...data];
    $("#lib-sub").textContent = `${rows.length} criativo(s) na biblioteca`;
    if (!rows.length) { box.innerHTML = `<div class="empty"><strong>Nenhum criativo encontrado</strong><span>Tente outra busca ou cadastre um novo.</span><a class="btn" href="#/cadastro">Cadastrar criativo</a></div>`; return; }
    box.innerHTML = `<div style="overflow:auto"><table class="tbl"><thead><tr><th>Criativo</th><th>Status</th><th class="num">Custo</th><th class="num">Vendas</th><th class="num">ROAS-equiv.</th><th class="num">Lucro</th><th>Saúde do dia</th><th>Motivo</th></tr></thead><tbody>${rows.map((c) => {
      const pc = profitClass(c.totals.profit_cents);
      const roas = c.totals.roas_equivalente;
      return `<tr class="click" data-id="${c.id}"><td><div class="nm">${esc(c.name)}</div><div class="sub">${esc(c.product || "—")} · ${FORMAT[c.format] ?? c.format} · ${fDate(c.start_date)}</div></td><td>${chipFor(c.health)}</td><td class="num">${fBRL(c.totals.cost_cents)}</td><td class="num">${c.totals.sales}</td><td class="num">${roas == null ? "—" : fRoas(roas)}</td><td class="num prof ${pc}">${c.totals.profit_cents == null ? (c.totals.has_pending ? "pendente" : "—") : fBRL(c.totals.profit_cents)}</td><td>${rulerFor(c.health)}</td><td class="mut">${esc(c.health.motivo ?? "—")}</td></tr>`;
    }).join("")}</tbody></table></div><div class="foot-note">ROAS-equiv. = faturamento ÷ custo c/ imposto (só comparação — a cor vem do Sinal). Lucro “pendente” = vendeu e o faturamento ainda não foi lançado.</div>`;
  } catch { box.innerHTML = `<div class="empty"><strong>Não foi possível carregar</strong></div>`; }
}

// ---------- Cadastro (T2 único + T3 em lote) ----------
// produto/formato/data mantidos após cada cadastro para encadear o próximo.
const R = { mode: "single", name: "", bulk: "", product: "", format: "video", start: todayLocal(), status: "ativo", url: "", notes: "" };
const bulkNames = () => R.bulk.split("\n").map((s) => s.trim()).filter(Boolean);
async function pageRegister() {
  let products = [];
  let existing = [];
  try { const { data } = await api("/api/creatives"); products = [...new Set(data.map((c) => c.product).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")); existing = data.map((c) => ({ name: c.name, status: c.status })); } catch {}
  const bulk = R.mode === "bulk";
  const isFuture = R.start > todayLocal();
  view().innerHTML = `
  <div class="ph"><div><h1>Cadastro</h1><p class="sub">Registre os criativos novos. Os números do dia entram depois, no lançamento.</p></div></div>
  <div class="cols">
  <section class="panel"><div class="panel-b">
    <div class="seg" role="group" aria-label="Modo de cadastro"><button type="button" data-mode="single" aria-pressed="${!bulk}">Um criativo</button><button type="button" data-mode="bulk" aria-pressed="${bulk}">Vários de uma vez</button></div>
    <div style="height:14px"></div>
    ${bulk
      ? `<div class="fld"><label for="r-bulk">Nomes dos criativos (um por linha)</label><textarea class="in" id="r-bulk" rows="6" placeholder="Depoimento cozinha 03&#10;UGC achadinho 04">${esc(R.bulk)}</textarea><div class="bulkprev" id="r-prev" aria-live="polite"></div><div class="err-msg" id="r-err" hidden></div></div>`
      : `<div class="fld"><label for="r-name">Nome do criativo</label><input class="in" id="r-name" value="${esc(R.name)}" placeholder="Ex.: Depoimento cozinha 03" autocomplete="off"><div class="err-msg" id="r-err" hidden></div></div>`}
    <div class="fld"><label for="r-product">Produto ou oferta</label><input class="in" id="r-product" list="r-products" value="${esc(R.product)}" placeholder="Ex.: Mini processador" autocomplete="off"><datalist id="r-products">${products.map((p)=>`<option value="${esc(p)}">`).join("")}</datalist><span class="hint">Mantido após cadastrar para encadear o próximo.</span></div>
    <div class="fld"><span class="l" style="font-weight:700">Formato</span><div class="seg" role="group" aria-label="Formato">${Object.entries(FORMAT).map(([k,v])=>`<button type="button" data-format="${k}" aria-pressed="${R.format===k}">${v}</button>`).join("")}</div></div>
    <div class="two">
      <div class="fld"><label for="r-start">Data de início</label><input type="date" class="in" id="r-start" value="${esc(R.start)}"><span class="hint">Mantida após cadastrar.</span></div>
      <div class="fld"><label for="r-status">Status inicial</label><select class="in" id="r-status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
    </div>
    ${isFuture ? `<p class="hint" id="r-pre">Pré-cadastro: começa em ${fDate(R.start)} — não conta Dia 1 nem dispara Sinal até ter movimento.</p>` : ``}
    ${bulk ? `` : `
    <div class="fld"><label for="r-url">Link do Criativo (opcional)</label><input class="in" id="r-url" type="url" value="${esc(R.url)}" placeholder="Pasta do Drive ou link do Criativo"></div>
    <div class="fld"><label for="r-notes">Observações (opcional)</label><textarea class="in" id="r-notes" placeholder="Gancho, ângulo, público…">${esc(R.notes)}</textarea></div>`}
    <div class="actions"><button class="btn" id="r-save" type="button"><span id="r-save-l">Cadastrar</span></button><button class="btn ghost" id="r-save-go" type="button">Cadastrar e lançar dados</button></div>
  </div></section>
  <section class="panel"><div class="panel-b"><strong>Últimos cadastrados</strong></div><ul class="recent" id="r-recent"><li class="mut">Carregando…</li></ul></section>
  </div>`;
  $("#r-status").value = R.status;
  const errEl = () => $("#r-err");
  const showErr = (m, sel) => { const e = errEl(); e.textContent = m; e.hidden = false; const i = sel ? $(sel) : null; if (i) { i.classList.add("err"); i.focus(); } };
  const clearErr = () => { const e = errEl(); if (e) e.hidden = true; $$(".in.err").forEach((i)=>i.classList.remove("err")); };
  const paintPreview = () => {
    const box = $("#r-prev");
    if (!box) { const l = $("#r-save-l"); if (l) l.textContent = "Cadastrar"; return; }
    const names = bulkNames();

async function paintRecent() {

async function submitRegister(goDaily, err) {
  if (R.mode === "bulk") {
    const names = bulkNames();
    if (!names.length) { err("Digite pelo menos um nome, um por linha.", "#r-bulk"); return; }
    try {
      const { data } = await api("/api/creatives/bulk", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({ names, product: R.product.trim(), format: R.format, start_date: R.start, status: R.status }) });
      // Mantém produto/formato/data para encadear; limpa só a lista.
      R.bulk = "";

    } catch (e) {

      if (e.body?.error === "nome_duplicado") err(warns[0] || "Há nomes repetidos ou já cadastrados (em vermelho).", "#r-bulk");
      else err("Não foi possível cadastrar. Confira os campos.", "#r-bulk");
    }
    return;
  }
  const payload = { name: R.name.trim(), product: R.product.trim(), format: R.format, start_date: R.start, status: R.status, url: R.url.trim(), notes: R.notes };
  if (!payload.name) { err("Informe o nome do criativo.", "#r-name"); return; }
  try {
    const { data } = await api("/api/creatives", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(payload) });
    // Mantém produto/formato/data para encadear; limpa só nome/link/observações.
    R.name = ""; R.url = ""; R.notes = "";
    toast(`Criativo cadastrado: ${data.name}`);
    if (goDaily) { location.hash = "#/lancamento"; } else { pageRegister(); const f = $("#r-name"); if (f) f.focus(); }
  } catch (e) {
    const warns = e.body?.warnings ?? [];
    if (e.body?.error === "nome_duplicado") err(warns[0] || "Já existe um criativo com esse nome.", "#r-name");
    else err("Não foi possível cadastrar. Confira os campos.", "#r-name");
  }
}

const dtHasPending = () => DT.dirty.size > 0 || DT.toDelete.size > 0;
function dtGuardDiscard(msg) {

}
async function pageDetail(id) {

function detailEntryFromRow(tr) {
  const tax = Number(tr.dataset.tax || 0.1386);
  const date = tr.dataset.date;
  const inv = Calc.parseMoedaParaCentavos($('[data-f="invest"]', tr).value);
  const rev = Calc.parseMoedaParaCentavos($('[data-f="rev"]', tr).value);
  const sales = Calc.parseInteiro($('[data-f="sales"]', tr).value);
  const clM = Calc.parseInteiro($('[data-f="clM"]', tr).value);
  const clS = Calc.parseInteiro($('[data-f="clS"]', tr).value);
  return { tax, date, inv, rev, sales, clM, clS };
}
function paintDetailRow(tr) {
  const { tax, date, inv, rev, sales, clM, clS } = detailEntryFromRow(tr);
  const bad =
    [inv, sales, clM, clS].some((v) => typeof v === "number" && Number.isNaN(v)) ||
    (rev != null && Number.isNaN(rev));
  ["invest", "sales", "rev", "clM", "clS"].forEach((f) => $('[data-f="' + f + '"]', tr).classList.remove("bad"));
  if (bad) return;
  const invC = inv == null ? 0 : inv;
  const salesN = sales == null ? 0 : sales;
  const clMN = clM == null ? 0 : clM;
  const clSN = clS == null ? 0 : clS;
  const row = Calc.calcRow({ date, investment_cents: invC, sales: salesN, revenue_cents: rev, clicks_meta: clMN, clicks_shopee: clSN, tax_rate: tax });
  $('[data-c="cost"]', tr).textContent = Calc.formatBRL(row.cost_cents);
  const pEl = $('[data-c="profit"]', tr);
  pEl.textContent = row.is_pending ? "pendente" : Calc.formatBRL(row.profit_cents);
  pEl.className = "calc" + (row.profit_cents == null || row.is_pending ? " nil" : row.profit_cents >= 0 ? " prof good" : " prof bad");
  $('[data-c="cpcM"]', tr).textContent = Calc.formatCPC(row.cpc_meta_cents);
  $('[data-c="cpcS"]', tr).textContent = Calc.formatCPC(row.cpc_shopee_cents);
  const hEl = $('[data-c="health"]', tr);
  const dayForSignal = { date, investment_cents: invC, sales: salesN, revenue_cents: rev, clicks_meta: clMN, clicks_shopee: clSN, tax_rate: tax };
  // Módulo único: dia sem movimento nunca tem sinal (igual ao servidor).
  if (!Calc.hasMovement(dayForSignal)) { hEl.textContent = "—"; return; }
  try {
    // Ao-vivo: data anterior ao Dia 1 salvo vira o novo Dia 1 após salvar (<=);
    // sem Dia 1 salvo, o primeiro dia com movimento é o Dia 1.
    const isDia1 = !DT.dia1 || date <= DT.dia1;
    const sig = Calc.evaluateDay(dayForSignal, isDia1);
    hEl.textContent = sig.saude === "atencao" ? `Atenção · ${sig.motivo ?? ""}` : (sig.motivo ?? "Saudável");
  } catch { hEl.textContent = "—"; }
}
function paintDetailTotals() {
  const rows = $$("#sheetbox tr[data-date]");
  const days = [];
  for (const tr of rows) {
    if (DT.toDelete.has(tr.dataset.date)) continue;
    const { tax, date, inv, rev, sales, clM, clS } = detailEntryFromRow(tr);
    if ([inv, sales, clM, clS].some((v) => typeof v === "number" && Number.isNaN(v))) continue;
    days.push({ date, investment_cents: inv ?? 0, sales: sales ?? 0, revenue_cents: rev, clicks_meta: clM ?? 0, clicks_shopee: clS ?? 0, tax_rate: tax });
  }
  const a = Calc.agg(days);
  const set = (k, txt, cls) => { const td = view().querySelector(`[data-t="${k}"]`); if (td) { td.textContent = txt; if (cls) td.className = cls; } };
  set("invest", Calc.formatBRL(a.investment_cents));
  set("cost", Calc.formatBRL(a.cost_cents));
  set("sales", String(a.sales));
  set("rev", a.costClosed_cents > 0 || a.revenue_cents > 0 ? Calc.formatBRL(a.revenue_cents) : "—");
  set("profit", a.profit_cents == null ? (a.has_pending ? "pendente" : "—") : Calc.formatBRL(a.profit_cents));
  set("clM", String(a.clicks_meta));
  set("clS", String(a.clicks_shopee));
  set("cpcM", Calc.formatCPC(a.cpc_meta_cents));
  set("cpcS", Calc.formatCPC(a.cpc_shopee_cents));
}

  }).join("")}</tbody><tfoot><tr><td class="dt">TOTAL</td><td data-t="invest"></td><td data-t="cost"></td><td data-t="sales"></td><td data-t="rev"></td><td data-t="profit"></td><td data-t="clM"></td><td data-t="clS"></td><td data-t="cpcM"></td><td data-t="cpcS"></td><td></td><td></td></tr></tfoot></table>`;
  $$("#sheetbox tr[data-date]").forEach(paintDetailRow);

function toggleDetailDelete(date) {
  if (DT.creative.status === "encerrado") { toast("Criativo encerrado não recebe lançamentos."); return; }
  if (DT.toDelete.has(date)) {
    DT.toDelete.delete(date);
    const tr = view().querySelector(`tr[data-date="${date}"]`);
    if (tr) { tr.classList.remove("todel"); }
    renderSheet();
    $$("#sheetbox tr[data-date]").forEach(paintDetailRow);
    paintDetailTotals();
    countDetail();
    return;
  }
  if (!confirm(`Excluir o dia ${fDate(date)} de ${DT.creative.name}? O dia some como se nunca tivesse existido.`)) return;
  DT.toDelete.add(date);
  DT.dirty.delete(date);
  renderSheet();
  $$("#sheetbox tr[data-date]").forEach(paintDetailRow);
  paintDetailTotals();
  countDetail();
}
function countDetail() {
  const btn = $("#d-save");
  const lbl = $("#d-count");
  if (!btn || !lbl) return;
  const n = DT.dirty.size + DT.toDelete.size;
  if (!DT.entries.length) { lbl.textContent = ""; btn.disabled = true; return; }
  lbl.textContent = n === 0 ? `${DT.entries.length} dia(s) — nada a salvar` : `${n} alteração(ões) não salva(s) em ${DT.entries.length} dia(s)`;
  btn.disabled = n === 0 || DT.creative.status === "encerrado";
}
function validateDetailRow(tr) {
  const { inv, rev, sales, clM, clS } = detailEntryFromRow(tr);
  $$(".ci", tr).forEach((i) => i.classList.remove("bad"));
  let bad = false;
  const mark = (f) => { $('[data-f="' + f + '"]', tr).classList.add("bad"); bad = true; };
  for (const [f, v] of [["invest", inv], ["sales", sales], ["rev", rev], ["clM", clM], ["clS", clS]]) {
    if (typeof v === "number" && Number.isNaN(v)) mark(f);
    if (typeof v === "number" && v != null && v < 0) mark(f);
  }
  for (const [f, v] of [["sales", sales], ["clM", clM], ["clS", clS]]) {

async function saveDetailBulk() {

function paintDayRow(tr) {
  const tax = Number(tr.dataset.tax || 0.1386);
  const date = DY.date;
  const dia1 = tr.dataset.dia1 || null;
  const inv = Calc.parseMoedaParaCentavos($('[data-f="invest"]', tr).value);
  const rev = Calc.parseMoedaParaCentavos($('[data-f="rev"]', tr).value);
  const sales = Calc.parseInteiro($('[data-f="sales"]', tr).value);
  const clM = Calc.parseInteiro($('[data-f="clM"]', tr).value);
  const clS = Calc.parseInteiro($('[data-f="clS"]', tr).value);
  const invC = inv == null ? 0 : inv;
  const salesN = sales == null ? 0 : sales;
  const clMN = clM == null ? 0 : clM;
  const clSN = clS == null ? 0 : clS;
  const bad = [inv, sales, clM, clS].some((v) => typeof v === "number" && Number.isNaN(v)) || (rev != null && Number.isNaN(rev));
  // Módulo único de cálculo (spec #6): custo/lucro/CPCs/pendente vêm do Calc.
  const row = bad ? null : Calc.calcRow({ date, investment_cents: invC, sales: salesN, revenue_cents: rev, clicks_meta: clMN, clicks_shopee: clSN, tax_rate: tax });
  const cost = row ? row.cost_cents : null;
  const isPending = row ? row.is_pending : false;
  const profit = row ? row.profit_cents : null;
  const cpcM = row ? row.cpc_meta_cents : null;
  const cpcS = row ? row.cpc_shopee_cents : null;
  $('[data-c="cost"]', tr).textContent = Calc.formatBRL(cost);
  const pEl = $('[data-c="profit"]', tr);
  pEl.textContent = isPending ? "pendente" : Calc.formatBRL(profit);
  pEl.className = "calc" + (profit == null || isPending ? "" : profit >= 0 ? " prof good" : " prof bad");
  $('[data-c="cpcM"]', tr).textContent = Calc.formatCPC(cpcM);
  $('[data-c="cpcS"]', tr).textContent = Calc.formatCPC(cpcS);
  const hEl = $('[data-c="health"]', tr);
  const dayForSignal = { date, investment_cents: invC, sales: salesN, revenue_cents: rev, clicks_meta: clMN, clicks_shopee: clSN, tax_rate: tax };
  if (bad || !Calc.hasMovement(dayForSignal)) { hEl.textContent = "—"; return; }
  try {
    const isDia1 = !dia1 || date <= dia1;
    const sig = Calc.evaluateDay(dayForSignal, isDia1);
    hEl.textContent = sig.saude === "atencao" ? `Atenção · ${sig.motivo ?? ""}` : (sig.motivo ?? "Saudável");
  } catch { hEl.textContent = "—"; }
}

// Filtros: período, Criativos, status, produto, decisão. Resumo com variação
// contra o período anterior + aviso de pendentes. Gráfico diário SVG
// (custo, faturamento, lucro/prejuízo, faixa nos dias pendentes).
// Tabela de decisão ordenável com clique abrindo o detalhe.
const D = { preset: "30d", from: "", to: "", ids: new Set(), status: "all", product: "all", decision: "all", sort: { k: "profit", dir: -1 }, data: null, products: [] };
const PRESETS = [["today","Hoje"],["yesterday","Ontem"],["7d","Últimos 7 dias"],["14d","Últimos 14 dias"],["30d","Últimos 30 dias"],["month","Este mês"],["lastmonth","Mês passado"],["all","Todo o período"],["custom","Personalizado"]];
function dAddDays(iso, n) { const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function dPresetRange() {
  const t = todayLocal();
  switch (D.preset) {
    case "today": return [t, t];
    case "yesterday": return [dAddDays(t,-1), dAddDays(t,-1)];
    case "7d": return [dAddDays(t,-6), t];
    case "14d": return [dAddDays(t,-13), t];
    case "30d": return [dAddDays(t,-29), t];
    case "month": return [t.slice(0,8)+"01", t];
    case "lastmonth": { const first = t.slice(0,8)+"01"; const [y,m] = first.split("-").map(Number); const prev = new Date(Date.UTC(y,m-2,1)); const pf = prev.toISOString().slice(0,10); return [pf.slice(0,8)+"01", dAddDays(first,-1)]; }
    case "all": return [null, null];
    default: return [D.from || t, D.to || t];
  }
}
function deltaHtml(cur, prev, invert) {
  if (cur == null || prev == null) return "";
  if (prev === 0) return cur === 0 ? '<span class="dl n">= estável</span>' : "";
  const p = (cur - prev) / Math.abs(prev) * 100;
  if (Math.abs(p) < 0.5) return '<span class="dl n">= estável</span>';
  const up = p > 0;
  const good = invert ? !up : up;
  return `<span class="dl ${good ? "g" : "b"}">${up ? "▲" : "▼"} ${Math.abs(p).toLocaleString("pt-BR",{maximumFractionDigits:0})}%</span>`;
}

    <div style="display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px"><span class="mut">Lucro no período</span><strong class="prof ${profCls}" style="font-size:28px">${t.profit_cents == null ? (t.has_pending ? "pendente" : "—") : fBRL(t.profit_cents)}</strong>${deltaHtml(t.profit_cents, p?.profit_cents ?? null)}${p ? '<span class="mut">vs período anterior</span>' : ""}</div>
    <div class="kpis">
      ${kpi("Investimento", fBRL(t.investment_cents), `custo ${fBRL(t.cost_cents)}`, deltaHtml(t.investment_cents, p?.investment_cents ?? null, true))}
      ${kpi("Faturamento", t.costClosed_cents > 0 ? fBRL(t.revenue_cents) : "—", t.has_pending ? `${t.pending_days} dia(s) pendente(s)` : "", deltaHtml(t.revenue_cents, p?.revenue_cents ?? null))}
      ${kpi("Vendas", String(t.sales), "", deltaHtml(t.sales, p?.sales ?? null))}
      ${kpi("ROAS-equiv.", t.roas_equivalente == null ? "—" : Calc.formatRoas(t.roas_equivalente), "fatur ÷ custo", deltaHtml(t.roas_equivalente, p?.roas_equivalente ?? null))}
      ${kpi("CPC Meta", Calc.formatCPC(t.cpc_meta_cents), "invest ÷ cliques", deltaHtml(t.cpc_meta_cents, p?.cpc_meta_cents ?? null, true))}
      ${kpi("CPC Shopee", Calc.formatCPC(t.cpc_shopee_cents), "invest ÷ cliques", deltaHtml(t.cpc_shopee_cents, p?.cpc_shopee_cents ?? null, true))}
    </div>
    ${pendNote}
  </div></section>
  <section class="panel"><div class="panel-h"><h2>Evolução diária</h2><span class="mut">custo · faturamento · lucro/prejuízo · faixa nos dias pendentes</span></div><div class="panel-b" id="chart-box"></div></section>
  <section class="panel"><div class="panel-h"><h2>Decisão por criativo</h2><span class="mut">clique abre o detalhe</span></div><div class="scroll" id="dash-tbl"></div>
  <div class="foot-note">Ordene por lucro, ROAS-equiv., custo ou vendas clicando no cabeçalho. A cor vem do Sinal (régua + Status + Motivo), nunca do ROAS.</div></section>`;
  drawChart($("#chart-box"), d.daily);
  renderDashTable();
}
function renderDashTable() {
  const d = D.data;
  if (!d) return;
  const rows = [...d.creatives].sort((x, y) => {
    const g = (r) => ({ profit: r.totals.profit_cents, roas: r.totals.roas_equivalente, cost: r.totals.cost_cents, sales: r.totals.sales })[D.sort.k];
    const a = g(x), b = g(y);
    if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
    return (a - b) * D.sort.dir;
  });
  const th = (k, label) => `<th class="num" data-sort="${k}">${label}${D.sort.k === k ? `<span class="ar">${D.sort.dir < 0 ? "↓" : "↑"}</span>` : ""}</th>`;
  $("#dash-tbl").innerHTML = `<table class="tbl"><thead><tr><th>Criativo</th><th>Status</th><th>Saúde</th>${th("profit","Lucro")}${th("roas","ROAS-equiv.")}${th("cost","Custo")}${th("sales","Vendas")}<th>Motivo</th></tr></thead><tbody>${rows.map((r) => {
    const pc = profitClass(r.totals.profit_cents);
    return `<tr class="click" data-id="${r.creative.id}"><td><div class="nm">${esc(r.creative.name)}</div><div class="sub">${esc(r.creative.product||"—")}</div></td><td>${chipFor(r.health)}</td><td>${rulerFor(r.health)}</td><td class="num prof ${pc}">${r.totals.profit_cents == null ? (r.totals.has_pending ? "pendente" : "—") : fBRL(r.totals.profit_cents)}</td><td class="num">${r.totals.roas_equivalente == null ? "—" : Calc.formatRoas(r.totals.roas_equivalente)}</td><td class="num">${fBRL(r.totals.cost_cents)}</td><td class="num">${r.totals.sales}</td><td class="mut">${esc(r.health.motivo ?? "—")}</td></tr>`;
  }).join("")}</tbody></table>`;
}
function drawChart(box, days) {
  if (!box) return;
  const W = Math.max(box.clientWidth || 600, 320), H = 220, P = { l: 56, r: 12, t: 12, b: 26 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const vals = [];
  for (const d of days) { if (d.empty) continue; vals.push(d.cost_cents, d.revenue_cents ?? 0, d.profit_cents ?? 0); }
  const max = Math.max(1, ...vals.map((v)=>Math.abs(v)));
  const n = days.length;
  const x = (i) => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => P.t + ih / 2 - (v / max) * (ih / 2 - 4);
  const bw = n ? Math.min(18, iw / Math.max(n,1) * 0.4) : 8;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico diário">`;
  s += `<line x1="${P.l}" y1="${y(0)}" x2="${W-P.r}" y2="${y(0)}" stroke="#D8DFDC"/>`;
  days.forEach((d, i) => {
    if (d.pending && !d.empty) s += `<rect x="${x(i)-bw}" y="${P.t}" width="${bw*2}" height="${ih}" fill="#F6E8BE" opacity="0.55"><title>${fDate(d.date)} · pendente</title></rect>`;
  });
  days.forEach((d, i) => {
    if (d.empty) return;
    const p = d.profit_cents ?? 0;
    const y0 = y(0), y1 = y(p);
    s += `<rect x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(2,Math.abs(y1-y0))}" fill="${p >= 0 ? "#2FBF7A" : "#E5595B"}"><title>${fDate(d.date)} · lucro ${d.profit_cents == null ? "pendente" : (d.profit_cents/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</title></rect>`;
  });
  const line = (get, color) => {
    const pts = days.map((d, i) => d.empty ? null : `${x(i).toFixed(1)},${y(get(d) ?? 0).toFixed(1)}`).filter(Boolean);
    if (pts.length < 2) return "";
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2"/>`;
  };
  s += line((d)=>d.cost_cents, "#16201C");
  s += line((d)=>d.revenue_cents ?? 0, "#0E76B8");
  days.forEach((d, i) => { if (i % Math.ceil(n/6) === 0) s += `<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#647570">${fDate(d.date)}</text>`; });
  s += `<g font-size="11"><circle cx="${P.l+6}" cy="8" r="4" fill="#16201C"/><text x="${P.l+14}" y="12" fill="#16201C">Custo</text><circle cx="${P.l+70}" cy="8" r="4" fill="#0E76B8"/><text x="${P.l+78}" y="12" fill="#16201C">Faturamento</text><rect x="${P.l+168}" y="4" width="10" height="8" fill="#2FBF7A"/><rect x="${P.l+180}" y="4" width="10" height="8" fill="#E5595B"/><text x="${P.l+194}" y="12" fill="#16201C">Lucro/prejuízo</text></g>`;
  s += `</svg>`;
  box.innerHTML = s;
}

// ---------- Config: imposto + backup/export (T5) ----------
async function pageConfig() {
  view().innerHTML = `
  <div class="ph"><div><h1>Configurações</h1><p class="sub">Imposto, backup e dados</p></div></div>
  <div class="cols">
  <section class="panel"><div class="panel-b">
    <h2 style="margin:0 0 8px">Imposto (%)</h2>
    <p class="hint">Taxa usada nos próximos lançamentos. Dias antigos ficam intactos (cada dia guarda a própria taxa).</p>
    <div class="fld"><label for="cfg-tax">Taxa atual (%)</label><input class="in" id="cfg-tax" inputmode="decimal" placeholder="13,86"><span class="hint">Aceita 13,86 ou 13.86 (= 13,86%).</span><div class="err-msg" id="cfg-tax-err" hidden></div></div>
    <div class="actions"><button class="btn" id="cfg-save" type="button">Salvar imposto</button></div>
  </div></section>
  <section class="panel"><div class="panel-b">
    <h2 style="margin:0 0 8px">Backup e dados</h2>
    <p class="hint" id="cfg-path">Caminho do arquivo: carregando…</p>
    <div class="actions"><button class="btn" id="cfg-backup" type="button">Fazer backup agora</button><button class="btn ghost" id="cfg-export" type="button">Exportar dados (JSON)</button></div>
    <div style="height:12px"></div>
    <strong>Últimos backups (30 mantidos)</strong>
    <ul class="recent" id="cfg-backs"><li class="mut">Carregando…</li></ul>
  </div></section>
  </div>`;
  try {
    const [{ data: s }, info] = await Promise.all([api("/api/settings"), api("/api/info")]);
    $("#cfg-tax").value = (s.tax_rate * 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    $("#cfg-path").textContent = `Caminho do arquivo: ${info.data.dbPath} (pasta ${info.data.dataDir}) — backups diários em backups/, 30 últimos.`;
  } catch { $("#cfg-path").textContent = "Não foi possível ler o caminho do arquivo."; }
  $("#cfg-save").addEventListener("click", async () => {
    const err = $("#cfg-tax-err");
    err.hidden = true;
    try {
      const { data } = await api("/api/settings", { method: "PUT", headers: {"content-type":"application/json"}, body: JSON.stringify({ tax_rate: $("#cfg-tax").value }) });
      $("#cfg-tax").value = (data.tax_rate * 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      toast(`Imposto atualizado para ${(data.tax_rate*100).toLocaleString("pt-BR")}% — dias antigos intactos.`);
    } catch (e) { err.textContent = "Valor inválido. Use algo como 13,86."; err.hidden = false; }
  });
  $("#cfg-backup").addEventListener("click", async () => {
    try { const { data } = await api("/api/backup", { method: "POST" }); toast(`Backup criado: ${data.file}`); await loadBacks(); }
    catch { toast("Não foi possível criar o backup."); }
  });
  $("#cfg-export").addEventListener("click", async () => {
    try {
      const { data } = await api("/api/export");
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `gestor-export-${todayLocal()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast("Dados exportados.");
    } catch { toast("Não foi possível exportar."); }
  });
  async function loadBacks() {
    try {
      const { data } = await api("/api/backups");
      $("#cfg-backs").innerHTML = data.length ? data.slice(0,30).map((b)=>`<li><span>${esc(b.file)}</span><span class="mut">${b.size != null ? (b.size/1024).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " KB" : ""}</span></li>`).join("") : `<li class="mut">Nenhum backup ainda.</li>`;
    } catch { $("#cfg-backs").innerHTML = `<li class="mut">—</li>`; }
  }
  await loadBacks();
}

function router() {
  $$(".nav a").forEach((a) => a.removeAttribute("aria-current"));
  const h = location.hash || "#/dashboard";
  if (!h.startsWith("#/criativo/") && typeof DT !== "undefined" && DT.id) { DT.id = null; DT.creative = null; DT.dirty = new Set(); DT.toDelete = new Set(); }
  if (h.startsWith("#/cadastro")) { $('[data-nav="cadastro"]').setAttribute("aria-current","page"); pageRegister(); }
  else if (h.startsWith("#/criativo/")) { $('[data-nav="criativos"]').setAttribute("aria-current","page"); pageDetail(h.split("/")[2]); }
  else if (h.startsWith("#/lancamento")) { $('[data-nav="lancamento"]').setAttribute("aria-current","page"); pageDaily(); }
  else if (h.startsWith("#/criativos")) { $('[data-nav="criativos"]').setAttribute("aria-current","page"); pageLibrary(); }
  else if (h.startsWith("#/config")) { $('[data-nav="config"]').setAttribute("aria-current","page"); pageConfig(); }
  else { $('[data-nav="dashboard"]').setAttribute("aria-current","page"); pageDashboard(); }
}
window.addEventListener("hashchange", router);
document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  if (!DT.id || !DT.creative) return;
  if (!dtHasPending()) return;
  if (a.getAttribute("href").startsWith("#/criativo/" + DT.id)) return;
  if (!confirm("Há alterações não salvas neste criativo. Sair sem salvar descarta tudo. Continuar?")) e.preventDefault();
}, true);
router();
</script>
